<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

    <title>Design Assets</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom, #72d772, #c4f3aa, #edf8e9);
            color: #2f3e2f;
        }

        main {
            max-width: 900px;
            margin: 80px auto;
            padding: 50px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 40px;
            margin-bottom: 10px;
            color: #3d5a40;
        }

        .intro {
            font-size: 15px;
            color: #5f6f5f;
            margin-bottom: 40px;
        }

        /* Image Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 25px;
        }

        .asset {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .asset img {
            width: 100%;
            max-width: 180px;
            border-radius: 12px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .asset img:hover {
            transform: translateY(-5px);
        }

        .caption {
            margin-top: 8px;
            font-size: 13px;
            color: #6b8f71;
        }

        hr {
            border: none;
            height: 1px;
            background-color: #dbe7db;
            margin: 40px 0;
        }
    </style>
</head>

<body>

<main>
    <h1>Design Assets</h1>
    <p class="intro">
        Here are the illustrated assets I created for my capstone project.
    </p>

    <div class="gallery">
        <div class="asset">
            <img src="images/basket.png" alt="woven basket">
            <div class="caption">Woven Basket</div>
        </div>

        <div class="asset">
            <img src="images/fig.png" alt="fig fruit">
            <div class="caption">Fig</div>
        </div>

        <div class="asset">
            <img src="images/tomato.png" alt="tomato veggie">
            <div class="caption">Tomato</div>
        </div>

        <div class="asset">
            <img src="images/zuchini.png" alt="zucchini veggie">
            <div class="caption">Zucchini</div>
        </div>
    </div>
</main>

</body>
</html>
