<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio 1: Blockbuster Video!</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+Mono:wght@350&family=Nunito:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Out By the Water</h1>
    </header>

    <main>
        <section class="video-section">
            <video id="myVideo" autoplay muted loop playsinline poster="images/poster.jpg">
                <source src="media/arboretum-video.webm" type="video/webm">
                <source src="media/arboretum-video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>

            <article class="quote">
                <p class="chinese">行到水穷处，坐看云起时</p>
                <p class="author">— Wang Wei</p>
                <p class="translation">Walk to where the water ends, then sit and watch the clouds rise.</p>
            </article>
        </section>
    </main>

</body>
</html>
